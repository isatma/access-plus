<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISATMA Wheelchair Exercise System</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Exo+2:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --cyan:  #00ffcc;
    --gold:  #ffcc00;
    --dark:  #060810;
    --panel: #0d1117;
    --bdr:   rgba(0,255,204,0.2);
  }
  html,body { width:100%; height:100%; overflow:hidden; background:var(--dark); color:#e0f0ff; font-family:'Exo 2',sans-serif; }

  #header {
    height:78px; display:flex; align-items:center; justify-content:space-between;
    padding:0 24px; background:var(--panel); border-bottom:2px solid var(--cyan); z-index:30; position:relative;
  }
  #branding h1 { font-family:'Orbitron',sans-serif; font-size:clamp(12px,1.7vw,19px); font-weight:900; color:var(--cyan); letter-spacing:2px; text-shadow:0 0 20px rgba(0,255,204,0.5); }
  #branding .sub { font-size:9px; color:#556; letter-spacing:3px; margin-top:2px; text-transform:uppercase; }

  .stats-row { display:flex; gap:12px; align-items:center; }
  .stat-box { text-align:center; background:rgba(0,255,204,0.05); border:1px solid var(--bdr); border-radius:8px; padding:5px 16px; min-width:82px; }
  .stat-box .slabel { font-size:9px; letter-spacing:3px; color:#556; text-transform:uppercase; display:block; }
  .stat-box .sval { font-family:'Orbitron',sans-serif; font-size:clamp(15px,1.9vw,21px); font-weight:900; color:#fff; display:block; line-height:1.2; }
  .stat-box.hl .sval { color:var(--cyan); text-shadow:0 0 12px rgba(0,255,204,0.6); }

  #calBadge { font-size:10px; letter-spacing:1px; padding:4px 12px; border-radius:20px; background:rgba(255,204,0,0.12); border:1px solid rgba(255,204,0,0.4); color:var(--gold); transition:all 0.5s; }
  #calBadge.done { background:rgba(0,255,204,0.1); border-color:rgba(0,255,204,0.4); color:var(--cyan); }

  #soundToggle { padding:7px 16px; background:transparent; color:var(--cyan); border:2px solid var(--cyan); border-radius:6px; font-family:'Exo 2',sans-serif; font-weight:700; font-size:12px; cursor:pointer; letter-spacing:1px; transition:all 0.2s; }
  #soundToggle:hover, #soundToggle.active { background:var(--cyan); color:#000; }

  #main { display:flex; width:100vw; height:calc(100vh - 78px); }
  .pane { position:relative; width:50%; height:100%; overflow:hidden; }
  #leftPane { background:#080c12; border-right:1px solid var(--bdr); }
  video { display:none; }
  canvas { position:absolute; top:0; left:0; width:100%; height:100%; }

  #calOverlay {
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:rgba(255,204,0,0.14); border:1px solid rgba(255,204,0,0.5);
    border-radius:10px; padding:8px 22px; text-align:center;
    z-index:10; pointer-events:none; transition:opacity 0.6s; white-space:nowrap;
  }
  #calOverlay .cal-title { font-family:'Orbitron',sans-serif; font-size:10px; color:var(--gold); letter-spacing:2px; }
  #calOverlay .cal-bw { background:rgba(255,255,255,0.08); border-radius:4px; height:5px; margin-top:5px; overflow:hidden; }
  #calOverlay .cal-b  { height:100%; background:var(--gold); border-radius:4px; transition:width 0.1s; }

  @media(max-width:600px){ #main{flex-direction:column;} .pane{width:100%;height:50%;} }
</style>
</head>
<body>

<div id="header">
  <div id="branding">
    <h1>⚙ ISATMA ERGOMETER</h1>
    <div class="sub">isatma.org &nbsp;|&nbsp; April 24, 2026</div>
  </div>
  <div class="stats-row">
    <div class="stat-box hl"><span class="slabel">Velocity</span><span id="vVal" class="sval">0.0</span></div>
    <div class="stat-box"><span class="slabel">Distance</span><span id="dVal" class="sval">0.0</span></div>
    <div class="stat-box"><span class="slabel">RPM</span><span id="rVal" class="sval">0</span></div>
    <div id="calBadge">⟳ CALIBRATING...</div>
  </div>
  <button id="soundToggle">🔇 SOUND OFF</button>
</div>

<div id="main">
  <div class="pane" id="leftPane">
    <video id="video" autoplay playsinline></video>
    <canvas id="ergCanvas"></canvas>
    <div id="calOverlay">
      <div class="cal-title">HOLD HANDS NEAR CENTER — CALIBRATING</div>
      <div class="cal-bw"><div class="cal-b" id="calBar" style="width:0%"></div></div>
    </div>
  </div>
  <div class="pane" id="rightPane">
    <canvas id="roadCanvas"></canvas>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
// ═══════════════════════════════════════════════════════
// ELEMENTS
// ═══════════════════════════════════════════════════════
const video      = document.getElementById('video');
const ergCanvas  = document.getElementById('ergCanvas');
const roadCanvas = document.getElementById('roadCanvas');
const eCtx       = ergCanvas.getContext('2d');
const rCtx       = roadCanvas.getContext('2d');
const calOverlay = document.getElementById('calOverlay');
const calBar     = document.getElementById('calBar');
const calBadge   = document.getElementById('calBadge');
const soundBtn   = document.getElementById('soundToggle');

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let velocity      = 0;
let distance      = 0;

// crankAngle: the rotation of the crank around its forward-backward axle.
//   0        = handle at RIGHT  (3 o'clock looking at the front face)
//   Math.PI/2  = handle at BOTTOM / closest to user (6 o'clock)
//   Math.PI    = handle at LEFT   (9 o'clock)
//   3π/2       = handle at TOP / farthest from user (12 o'clock)
let crankAngle    = 0;

let lastHandAngle = null;
let handVisible   = false;

// Calibration — find where the user's hand naturally rests → position hub there
const CAL_SAMPLES = 55;
let calSamples    = [];
let calibrated    = false;
let hubNX         = 0.5;   // normalized hub X (horizontal center)
let hubNY         = 0.55;  // normalized hub Y — updated after calibration

// RPM tracking
let accumRad    = 0;
let lastRevTime = Date.now();
let displayRPM  = 0;

// Road / scenery
let roadOffset = 0, treeOffset = 0, cloudX = 0, sunPulse = 0;

// Audio
let audioCtx = null, isMuted = true, lastClick = 0;

// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
soundBtn.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  isMuted = !isMuted;
  soundBtn.innerText = isMuted ? '🔇 SOUND OFF' : '🔊 SOUND ON';
  soundBtn.classList.toggle('active', !isMuted);
  if (!isMuted && audioCtx.state === 'suspended') audioCtx.resume();
});
function playClick(vol) {
  if (!audioCtx || isMuted) return;
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(160, audioCtx.currentTime);
  o.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.035);
  g.gain.setValueAtTime(vol * 0.09, audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(); o.stop(audioCtx.currentTime + 0.04);
}

// ═══════════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════════
function resize() {
  ergCanvas.width  = ergCanvas.clientWidth;
  ergCanvas.height = ergCanvas.clientHeight;
  roadCanvas.width  = roadCanvas.clientWidth;
  roadCanvas.height = roadCanvas.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// ═══════════════════════════════════════════════════════════════════════════
// DRAW ERGOMETER — AXLE POINTS AT CAMERA (forward-backward spin)
//
// The crank rotates around an axle that points straight at the viewer.
// This means the handle traces a VERTICAL ELLIPSE in screen space:
//
//   screen X of handle = hubX + sin(crankAngle) * Rx   ← horizontal spread (narrow)
//   screen Y of handle = hubY - cos(crankAngle) * Ry   ← vertical travel (tall)
//   depth              = sin(crankAngle)               ← +1 = far, -1 = near
//
// Ry > Rx  →  the ellipse is TALLER than it is wide (perspective foreshortening)
// When depth < 0 (handle coming toward viewer) it is BIGGER and BRIGHTER.
// When depth > 0 (handle moving away)          it is SMALLER and DIMMER.
//
// The arm connecting hub to handle follows the same ellipse.
// ═══════════════════════════════════════════════════════════════════════════
function drawErgometer(results) {
  const W  = ergCanvas.width;
  const H  = ergCanvas.height;
  const cx = W * hubNX;
  const cy = H * hubNY;

  // Ellipse radii for the crank path
  // Ry = tall (actual reach radius), Rx = foreshortened width
  const Ry = Math.min(W, H) * 0.30;   // vertical radius — full arm length
  const Rx = Ry * 0.28;               // horizontal radius — foreshortened (axle toward camera)

  eCtx.clearRect(0, 0, W, H);

  // ── Background ──
  eCtx.fillStyle = '#080c12';
  eCtx.fillRect(0, 0, W, H);

  // Soft glow behind hub
  const bgG = eCtx.createRadialGradient(cx, cy, 0, cx, cy, Ry * 2);
  bgG.addColorStop(0, 'rgba(0,100,200,0.08)');
  bgG.addColorStop(1, 'rgba(0,0,0,0)');
  eCtx.fillStyle = bgG;
  eCtx.fillRect(0, 0, W, H);

  // ── Webcam ghost (mirrored) ──
  eCtx.save();
  eCtx.scale(-1, 1); eCtx.translate(-W, 0);
  eCtx.globalAlpha = 0.28;
  eCtx.drawImage(video, 0, 0, W, H);
  eCtx.restore();
  eCtx.globalAlpha = 1;

  // ── Ellipse guide (the path the handle traces) ──
  eCtx.strokeStyle = 'rgba(0,255,204,0.10)';
  eCtx.lineWidth   = 1.5;
  eCtx.setLineDash([5, 7]);
  eCtx.beginPath();
  eCtx.ellipse(cx, cy, Rx, Ry, 0, 0, Math.PI * 2);
  eCtx.stroke();
  eCtx.setLineDash([]);

  // ── Compute handle positions ──
  // Handle A: at crankAngle
  // Handle B: opposite side (crankAngle + π)
  // depth: sin(angle) → negative = coming TOWARD viewer (near), positive = going AWAY (far)
  const posA = getHandlePos(cx, cy, Rx, Ry, crankAngle);
  const posB = getHandlePos(cx, cy, Rx, Ry, crankAngle + Math.PI);

  // Draw the arm that is FARTHER (larger depth/sin) first (behind)
  if (posA.depth >= posB.depth) {
    drawArm(eCtx, cx, cy, posA, false, Ry);  // A behind  (sin positive = far)
    drawArm(eCtx, cx, cy, posB, true,  Ry);  // B in front
  } else {
    drawArm(eCtx, cx, cy, posB, false, Ry);
    drawArm(eCtx, cx, cy, posA, true,  Ry);
  }

  // ── Central hub — white cylinder seen end-on ──
  drawHub(eCtx, cx, cy, Rx, Ry);

  // ── Hand landmarks ──
  if (results && results.multiHandLandmarks) {
    results.multiHandLandmarks.forEach((lm, i) => {
      drawHandSkeleton(eCtx, lm, W, H, i === 0 ? '#00ffcc' : '#0088ff');
    });
  }

  // ── Calibration prompt ──
  if (!calibrated) {
    eCtx.strokeStyle = 'rgba(255,204,0,0.35)';
    eCtx.lineWidth   = 1.5;
    eCtx.setLineDash([8, 6]);
    eCtx.beginPath();
    eCtx.ellipse(cx, cy, Rx * 1.6, Ry * 0.75, 0, 0, Math.PI * 2);
    eCtx.stroke();
    eCtx.setLineDash([]);
    eCtx.fillStyle  = 'rgba(255,204,0,0.75)';
    eCtx.font       = `${Math.max(11, Ry * 0.1)}px 'Exo 2'`;
    eCtx.textAlign  = 'center';
    eCtx.fillText('Make a circular cranking motion here', cx, cy + Ry * 1.22);
  }
}

// ─────────────────────────────────────────
// Get handle screen position + depth for a given crank angle
// angle = 0 → handle at right, π/2 → bottom/near, π → left, 3π/2 → top/far
// ─────────────────────────────────────────
function getHandlePos(cx, cy, Rx, Ry, angle) {
  // depth: -1 = maximally toward viewer, +1 = maximally away
  const depth = Math.sin(angle);       // sin: 0 at sides, +1 at top(far), -1 at bottom(near)
  // Actually let's define: crankAngle=0 at RIGHT, increases clockwise
  // bottom (closest to user) = angle π/2
  // We want near = angle π/2 → sin(π/2)=1, but we want near to be LARGE
  // Flip: nearness = -sin(angle)  → near when angle=π/2: nearness=−1... 
  // Simpler: just use depth = sin(angle), near = depth < 0
  const sx = cx + Math.sin(angle) * Rx;    // horizontal: sin for left-right swing
  const sy = cy - Math.cos(angle) * Ry;    // vertical: -cos so 0°=top? no:
  // Let's set angle=0 → handle at BOTTOM (nearest), increases to top:
  // Actually match the photos: handle comes toward camera at bottom of stroke
  // Use: sx = cx + sin(a)*Rx,  sy = cy + cos(a)*Ry,  depth = -cos(a)
  // depth = -cos(a): at a=0 depth=-1 (near/bottom), a=π depth=+1 (far/top)
  const sx2 = cx + Math.sin(angle) * Rx;
  const sy2 = cy + Math.cos(angle) * Ry;
  const depth2 = -Math.cos(angle);  // -1=near(large/bright), +1=far(small/dim)

  // Scale factor based on depth: near = larger, far = smaller
  const t  = (depth2 + 1) * 0.5;   // 0=far, 1=near
  const sc = 0.55 + t * 0.45;       // 0.55 (far) → 1.0 (near)

  return { x: sx2, y: sy2, depth: depth2, scale: sc, nearness: t };
}

// ─────────────────────────────────────────
// Draw one crank arm + handle
// ─────────────────────────────────────────
function drawArm(ctx, cx, cy, pos, isFront, Ry) {
  const { x, y, scale, nearness } = pos;

  // ── Crank arm: line from hub to handle joint ──
  // Chrome tube — gradient from dim (hub) to bright (handle)
  const armAlpha = isFront ? 0.9 + nearness * 0.1 : 0.35;
  const armW     = (isFront ? 12 : 8) * scale;

  const armGr = ctx.createLinearGradient(cx, cy, x, y);
  if (isFront) {
    armGr.addColorStop(0,   `rgba(80,80,100,${armAlpha})`);
    armGr.addColorStop(0.4, `rgba(200,210,220,${armAlpha})`);
    armGr.addColorStop(0.7, `rgba(240,245,255,${armAlpha})`);
    armGr.addColorStop(1,   `rgba(160,170,180,${armAlpha})`);
  } else {
    armGr.addColorStop(0, 'rgba(40,40,50,0.5)');
    armGr.addColorStop(1, 'rgba(70,70,80,0.4)');
  }

  ctx.strokeStyle = armGr;
  ctx.lineWidth   = armW;
  ctx.lineCap     = 'round';
  ctx.shadowColor = isFront ? `rgba(0,255,204,${nearness * 0.4})` : 'transparent';
  ctx.shadowBlur  = isFront ? nearness * 16 : 0;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // ── Handle grip: horizontal bar perpendicular to the axle ──
  // In the photo the grip bar is roughly LEFT-RIGHT (horizontal) when seen face-on
  // Its apparent length foreshortens slightly with depth but stays mostly horizontal
  const gripLen  = Ry * 0.26 * scale;
  const gripW    = (isFront ? 13 : 8) * scale;

  const g1x = x - gripLen, g1y = y;   // left end of grip
  const g2x = x + gripLen, g2y = y;   // right end of grip

  // Foam grip body — dark segmented rubber
  ctx.strokeStyle = isFront
    ? `rgba(${20 + nearness*15}, ${20 + nearness*10}, ${22 + nearness*8}, 0.95)`
    : 'rgba(25,25,28,0.55)';
  ctx.lineWidth   = gripW * 2;
  ctx.lineCap     = 'round';
  ctx.shadowColor = isFront ? `rgba(0,255,204,${nearness * 0.55})` : 'transparent';
  ctx.shadowBlur  = isFront ? nearness * 22 : 0;
  ctx.beginPath();
  ctx.moveTo(g1x, g1y);
  ctx.lineTo(g2x, g2y);
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Foam grip segments (ridges like in photo)
  const segs = 5;
  for (let s = 0; s <= segs; s++) {
    const t  = s / segs;
    const gx = g1x + (g2x - g1x) * t;
    ctx.strokeStyle = isFront
      ? `rgba(45,45,50,${0.6 + nearness * 0.25})`
      : 'rgba(35,35,40,0.4)';
    ctx.lineWidth   = gripW * 2.1;
    ctx.beginPath();
    ctx.moveTo(gx, g1y - 1); ctx.lineTo(gx, g2y + 1);
    ctx.stroke();
  }

  // Grip highlight (sheen stripe along top of foam)
  if (isFront) {
    const shGr = ctx.createLinearGradient(g1x, g1y, g2x, g2y);
    shGr.addColorStop(0,   'rgba(255,255,255,0)');
    shGr.addColorStop(0.3, `rgba(255,255,255,${0.08 + nearness * 0.1})`);
    shGr.addColorStop(0.7, `rgba(255,255,255,${0.06 + nearness * 0.08})`);
    shGr.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.strokeStyle = shGr;
    ctx.lineWidth   = gripW * 0.6;
    ctx.beginPath();
    ctx.moveTo(g1x, g1y - gripW * 0.55);
    ctx.lineTo(g2x, g2y - gripW * 0.55);
    ctx.stroke();
  }

  // End caps
  [g1x, g2x].forEach(ex => {
    const capG = ctx.createRadialGradient(ex, y, 0, ex, y, gripW * 0.9);
    capG.addColorStop(0, isFront ? `rgba(80,80,85,${0.7+nearness*0.3})` : 'rgba(40,40,42,0.4)');
    capG.addColorStop(1, 'rgba(15,15,18,0.8)');
    ctx.fillStyle = capG;
    ctx.beginPath();
    ctx.arc(ex, y, gripW * 0.95, 0, Math.PI * 2);
    ctx.fill();
  });

  // Elbow joint (where arm meets grip bar)
  const jSize = gripW * (isFront ? 1.15 : 0.85);
  const jGr   = ctx.createRadialGradient(x, y, 0, x, y, jSize);
  jGr.addColorStop(0,   isFront ? '#eef' : '#444');
  jGr.addColorStop(0.5, isFront ? '#aac' : '#333');
  jGr.addColorStop(1,   '#222');
  ctx.fillStyle   = jGr;
  ctx.shadowColor = isFront ? `rgba(180,220,255,${nearness*0.5})` : 'transparent';
  ctx.shadowBlur  = isFront ? 8 : 0;
  ctx.beginPath();
  ctx.arc(x, y, jSize, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
}

// ─────────────────────────────────────────
// Draw the central hub (axle end-on)
// Looks like a white disc/cylinder face-on
// ─────────────────────────────────────────
function drawHub(ctx, cx, cy, Rx, Ry) {
  // Outer flange ring
  const fR  = Rx * 1.35;
  const fGr = ctx.createRadialGradient(cx-fR*0.2, cy-fR*0.2, 1, cx, cy, fR);
  fGr.addColorStop(0,   '#999');
  fGr.addColorStop(0.5, '#dde');
  fGr.addColorStop(0.8, '#bbc');
  fGr.addColorStop(1,   '#555');
  ctx.fillStyle   = fGr;
  ctx.shadowColor = 'rgba(0,180,255,0.3)';
  ctx.shadowBlur  = 10;
  ctx.beginPath();
  ctx.ellipse(cx, cy, fR, fR * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Inner hub face (white disc — the main white cylinder face in photo)
  const hR  = fR * 0.72;
  const hGr = ctx.createRadialGradient(cx - hR*0.25, cy - hR*0.25, 1, cx, cy, hR);
  hGr.addColorStop(0,   '#ffffff');
  hGr.addColorStop(0.5, '#e8eef5');
  hGr.addColorStop(0.85, '#c0ccd8');
  hGr.addColorStop(1,   '#7a8898');
  ctx.fillStyle = hGr;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hR, hR * 0.55, 0, 0, Math.PI * 2);
  ctx.fill();

  // Center bolt
  const bGr = ctx.createRadialGradient(cx, cy, 0, cx, cy, fR * 0.18);
  bGr.addColorStop(0, '#fff');
  bGr.addColorStop(0.4, '#aab');
  bGr.addColorStop(1, '#334');
  ctx.fillStyle = bGr;
  ctx.beginPath();
  ctx.arc(cx, cy, fR * 0.18, 0, Math.PI * 2);
  ctx.fill();

  // Collar / adjustment ring (black band — like in photo)
  ctx.strokeStyle = '#111';
  ctx.lineWidth   = fR * 0.22;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hR * 0.62, hR * 0.62 * 0.55, 0, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = 'rgba(0,255,204,0.4)';
  ctx.lineWidth   = 1;
  ctx.beginPath();
  ctx.ellipse(cx, cy, hR * 0.62, hR * 0.62 * 0.55, 0, 0, Math.PI * 2);
  ctx.stroke();
}

// ─────────────────────────────────────────
// Hand skeleton — mirrored X
// ─────────────────────────────────────────
function drawHandSkeleton(ctx, lm, W, H, color) {
  const mx = pt => (1 - pt.x) * W;
  const my = pt => pt.y * H;
  const conn = [
    [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
    [0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],
    [0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]
  ];
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.globalAlpha = 0.7;
  conn.forEach(([a,b]) => {
    ctx.beginPath(); ctx.moveTo(mx(lm[a]), my(lm[a])); ctx.lineTo(mx(lm[b]), my(lm[b])); ctx.stroke();
  });
  lm.forEach((pt, i) => {
    ctx.globalAlpha = 1;
    ctx.fillStyle   = i === 0 ? '#fff' : color;
    ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(mx(pt), my(pt), i===0?6:3.5, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  });
  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════
// ROAD
// ═══════════════════════════════════════════════════════
function drawRoad() {
  const W=roadCanvas.width, H=roadCanvas.height, ctx=rCtx, hY=H*0.43;
  ctx.clearRect(0,0,W,H);

  // Sky
  const sky=ctx.createLinearGradient(0,0,0,hY);
  sky.addColorStop(0,'#0a1428'); sky.addColorStop(0.7,'#1a3058'); sky.addColorStop(1,'#2a5078');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,hY);

  // Stars
  for(let s=0;s<40;s++){
    ctx.fillStyle=`rgba(255,255,255,${0.3+(s%3)*0.2})`;
    ctx.beginPath(); ctx.arc((s*173+20)%W,(s*89)%(hY*0.6),0.9,0,Math.PI*2); ctx.fill();
  }

  // Sun
  sunPulse+=0.018;
  const sX=W*0.76,sY=hY*0.40;
  const sg=ctx.createRadialGradient(sX,sY,0,sX,sY,65);
  sg.addColorStop(0,'rgba(255,220,100,0.45)'); sg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sX,sY,65,0,Math.PI*2); ctx.fill();
  const sb=ctx.createRadialGradient(sX-5,sY-5,2,sX,sY,27);
  sb.addColorStop(0,'#fff8d0'); sb.addColorStop(0.5,'#ffcc44'); sb.addColorStop(1,'#ff8800');
  ctx.fillStyle=sb; ctx.beginPath(); ctx.arc(sX,sY,27+Math.sin(sunPulse)*1.5,0,Math.PI*2); ctx.fill();

  // Clouds
  cloudX=(cloudX+0.14)%(W+300);
  [[cloudX%(W+200)-100,hY*0.22,1],[(cloudX*0.6+W*0.42)%(W+200)-100,hY*0.40,0.7]].forEach(([x,y,sc])=>{
    ctx.fillStyle='rgba(255,255,255,0.11)';
    [[0,0,26],[22,6,18],[44,0,22],[11,-14,16],[32,-12,15]].forEach(([dx,dy,r])=>{
      ctx.beginPath(); ctx.arc(x+dx*sc,y+dy*sc,r*sc,0,Math.PI*2); ctx.fill();
    });
  });

  // Grass
  const gr=ctx.createLinearGradient(0,hY,0,H);
  gr.addColorStop(0,'#2a5c1a'); gr.addColorStop(0.5,'#1e4412'); gr.addColorStop(1,'#0f2208');
  ctx.fillStyle=gr; ctx.fillRect(0,hY,W,H-hY);

  // Road
  const vpX=W/2,rHB=W*0.43,rHT=9;
  const rg=ctx.createLinearGradient(0,hY,0,H);
  rg.addColorStop(0,'#1a1a1a'); rg.addColorStop(1,'#303030');
  ctx.fillStyle=rg;
  ctx.beginPath(); ctx.moveTo(vpX-rHT,hY); ctx.lineTo(vpX+rHT,hY);
  ctx.lineTo(vpX+rHB,H); ctx.lineTo(vpX-rHB,H); ctx.closePath(); ctx.fill();

  ctx.strokeStyle='#fff'; ctx.lineWidth=2.5; ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(vpX-rHT,hY); ctx.lineTo(vpX-rHB,H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(vpX+rHT,hY); ctx.lineTo(vpX+rHB,H); ctx.stroke();

  // Dashes
  roadOffset+=Math.abs(velocity)*1.2;
  for(let d=0;d<10;d++){
    const t0=((d/10)+(roadOffset*0.013)%1)%1, t1=Math.min(1,t0+0.044);
    if(t0>0.97) continue;
    const y0=hY+(H-hY)*t0, y1=hY+(H-hY)*t1;
    const hw0=Math.max(1,t0*5.5), hw1=Math.max(1,t1*5.5);
    ctx.fillStyle='#fff';
    ctx.beginPath();
    ctx.moveTo(vpX-hw0,y0); ctx.lineTo(vpX+hw0,y0);
    ctx.lineTo(vpX+hw1,y1); ctx.lineTo(vpX-hw1,y1);
    ctx.closePath(); ctx.fill();
  }

  // Trees
  treeOffset=(treeOffset+Math.abs(velocity)*0.09)%1;
  [0.1,0.35,0.62,0.87].forEach((base,i)=>{
    const t=(base+treeOffset)%1;
    if(t<0.03) return;
    const y=hY+(H-hY)*t, sz=10+t*68, alp=Math.min(1,t*2);
    const xlR=vpX-rHT-(rHB-rHT)*t, xrR=vpX+rHT+(rHB-rHT)*t;
    [xlR-sz*1.3, xrR+sz*1.3].forEach((tx,ti)=>{
      ctx.globalAlpha=alp;
      if((i+ti)%2===0){
        ctx.fillStyle='#1e5c0f';
        ctx.beginPath(); ctx.moveTo(tx,y-sz*2.3); ctx.lineTo(tx-sz*0.78,y-sz*0.7); ctx.lineTo(tx+sz*0.78,y-sz*0.7); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#164a09';
        ctx.beginPath(); ctx.moveTo(tx,y-sz*3.0); ctx.lineTo(tx-sz*0.52,y-sz*1.6); ctx.lineTo(tx+sz*0.52,y-sz*1.6); ctx.closePath(); ctx.fill();
        ctx.fillStyle='#6b4020'; ctx.fillRect(tx-sz*0.13,y-sz*0.72,sz*0.26,sz*0.75);
      } else {
        const rg2=ctx.createRadialGradient(tx-sz*0.28,y-sz*1.28,sz*0.1,tx,y-sz,sz);
        rg2.addColorStop(0,'#4a9a1a'); rg2.addColorStop(1,'#1e5c08');
        ctx.fillStyle=rg2; ctx.beginPath(); ctx.arc(tx,y-sz,sz*0.92,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#6b4020'; ctx.fillRect(tx-sz*0.13,y,sz*0.26,sz*0.62);
      }
      ctx.globalAlpha=1;
    });
  });
}

// ═══════════════════════════════════════════════════════
// MEDIAPIPE
// ═══════════════════════════════════════════════════════
const hands = new Hands({ locateFile: f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}` });
hands.setOptions({ maxNumHands:2, modelComplexity:1, minDetectionConfidence:0.55, minTrackingConfidence:0.5 });

hands.onResults(results => {
  handVisible = false;
  const W=ergCanvas.width, H=ergCanvas.height;
  let primaryLM = null;

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    primaryLM   = results.multiHandLandmarks[0];
    handVisible = true;
  }

  if (primaryLM) {
    const wrist = primaryLM[0];
    const mx = 1 - wrist.x;  // mirror X
    const my = wrist.y;

    // ── CALIBRATION ──
    if (!calibrated) {
      calSamples.push({ x: mx, y: my });
      calBar.style.width = (calSamples.length / CAL_SAMPLES * 100) + '%';
      if (calSamples.length >= CAL_SAMPLES) {
        const avgY = calSamples.reduce((s,p) => s+p.y, 0) / calSamples.length;
        hubNX = 0.5;
        // Hub positioned BELOW where hand rests so the top of the crank
        // arc is comfortably within reach
        hubNY = Math.min(0.82, avgY + 0.20);
        calibrated = true;
        calOverlay.style.opacity = '0';
        setTimeout(() => calOverlay.style.display='none', 700);
        calBadge.textContent = '✓ CALIBRATED';
        calBadge.classList.add('done');
      }
    }

    // ── ROTATION — track angle of hand around hub ──
    // The user cranks in a forward-backward circle.
    // We track the 2D screen angle of their hand relative to the hub.
    // As the hand moves UP on screen → going away from camera (top of stroke)
    // As the hand moves DOWN       → coming toward camera (bottom of stroke)
    const dx = mx - hubNX;
    const dy = my - hubNY;
    const currentAngle = Math.atan2(dy, dx);

    if (lastHandAngle !== null && calibrated) {
      let delta = currentAngle - lastHandAngle;
      if (delta >  Math.PI) delta -= Math.PI * 2;
      if (delta < -Math.PI) delta += Math.PI * 2;

      if (Math.abs(delta) > 0.008 && Math.abs(delta) < 1.5) {
        velocity += delta * 7.5;

        // RPM
        accumRad += Math.abs(delta);
        if (accumRad >= Math.PI * 2) {
          const now = Date.now();
          displayRPM  = Math.round(60 / ((now - lastRevTime) / 1000));
          accumRad    = 0;
          lastRevTime = now;
        }
      }
    }
    lastHandAngle = currentAngle;

    // Drive crank visual angle directly from tracked angle
    // so the graphic handle follows the hand position on screen
    if (calibrated) {
      crankAngle = Math.atan2(my - hubNY, mx - hubNX);
    }
  } else {
    lastHandAngle = null;
    displayRPM = Math.max(0, displayRPM - 1);
  }

  // ── PHYSICS ──
  // When hand not visible, let momentum carry the crank
  if (!handVisible) crankAngle += velocity * 0.08;
  distance += Math.abs(velocity) * 0.045;
  velocity *= 0.991;

  // ── AUDIO ──
  if (!isMuted && Math.abs(velocity) > 0.25) {
    const interval = Math.max(40, 260 / Math.abs(velocity));
    if (Date.now() - lastClick > interval) {
      playClick(Math.min(1, Math.abs(velocity)/12));
      lastClick = Date.now();
    }
  }

  // ── UI ──
  document.getElementById('vVal').innerText = Math.abs(velocity).toFixed(1);
  document.getElementById('dVal').innerText = distance.toFixed(1);
  document.getElementById('rVal').innerText = displayRPM;

  drawErgometer(results);
  drawRoad();
});

// ═══════════════════════════════════════════════════════
// CAMERA
// ═══════════════════════════════════════════════════════
const camera = new Camera(video, {
  onFrame: async () => await hands.send({ image: video }),
  width: 640, height: 480
});
camera.start();
</script>
</body>
</html>
